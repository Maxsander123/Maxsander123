name: Update latest blog posts

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README from blog RSS or Atom
        run: python3 scripts/update_blog.py

      - name: Commit changed README
        run: |
          if git diff --quiet -- README.md; then
            echo "No blog updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest blog posts"
          git push
